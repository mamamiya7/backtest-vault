# Owner-controlled staging deployment. No paid resource is requested by this file.
# Free hosting can sleep; choose and approve production capacity before public launch.
services:
  - type: web
    name: backtest-vault-account-staging
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: "8080"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_PLAN_ID
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
