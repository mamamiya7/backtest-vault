name: Local checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run check
      - run: npm run package:public
  runner:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cases: ['--from-case=1 --to-case=20', '--from-case=21 --to-case=40', '--from-case=41 --to-case=60']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/test-runner.cjs ${{ matrix.cases }}
  installation:
    name: Install package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:install
      - run: npm run package:release -- --output releases/download
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: backtest-vault-download
          path: releases/download/*
          if-no-files-found: error
